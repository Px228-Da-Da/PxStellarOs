<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VSCode (Lite)</title>
<style>
html, body{
  margin:0; height:100%; overflow:hidden;
  font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  background:#1e1e1e;
}
#root{ display:flex; height:100%; min-height:0; min-width:0; }

/* ✅ Запрещаем выделение текста в интерфейсе (сайдбар, табы, статусбар и т.п.) */
.activitybar,
#explorer,
.statusbar,
.sidebar,
.sidebar-header,
.section,
.section-title,
.explorer-item,
#root {
  -webkit-user-select: none;
  user-select: none;
}

/* ✅ Разрешаем выделение внутри Monaco */
#container,
#container * {
  -webkit-user-select: text !important;
  user-select: text !important;
}

/* ✅ Разрешаем выделение в полях ввода (если появятся) */
input, textarea {
  -webkit-user-select: text !important;
  user-select: text !important;
}


/* Activity bar */
.activitybar{
  width:48px; background:#333333;
  display:flex; flex-direction:column; align-items:center;
  padding:6px 0;
  border-right:1px solid #2a2a2a;
}
.activitybar button{
  width:48px; height:48px;
  background:none; border:none;
  cursor:pointer;
  color:#c5c5c5; font-size:18px;
}
.activitybar button:hover{ background:#2a2a2a; }
.activitybar .active{ color:#fff; }

/* Side bar */
.sidebar{
  width:300px;
  background:#252526;
  color:#ccc;
;
  display:flex; flex-direction:column;
  border-right:1px solid #2a2a2a;
  min-width:0; min-height:0;
}
.sidebar-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 10px 6px 12px;
  font-size:12px; letter-spacing:1px;
  color:#c5c5c5;
}
.sidebar-header .dots{
  opacity:.8;
  padding:2px 8px;
  border-radius:4px;
}
.sidebar-header .dots:hover{ background:rgba(255,255,255,.06); cursor:pointer; }

.section{
  padding:6px 0;
}
.section-title{
  padding:6px 12px;
  font-size:11px;
  color:#bbbbbb;
  display:flex; align-items:center;
  gap:6px;
  user-select:none;
}
.section-title .chev{ opacity:.8; }
.section-body{
  padding:2px 0;
}

/* explorer items */
.explorer-item{
  padding:4px 12px 4px 20px;
  cursor:pointer;
  color:#ddd;
  user-select:none;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
}
.explorer-item:hover{ background: rgba(255,255,255,0.06); }
.explorer-item.active{ background: rgba(255,255,255,0.10); }

/* Main editor */
.main{
  flex:1; display:flex; flex-direction:column;
  min-width:0; min-height:0;
  background:#1e1e1e;
}
#container{
  flex:1;
  min-width:0; min-height:0;
}

/* Status bar */
.statusbar{
  height:22px;
  background:#007acc;
  color:#fff;
  font-size:12px;
  padding:2px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  user-select:none;
}
.status-left, .status-right{
  display:flex; align-items:center; gap:12px;
}


/* ===== Monaco overlays must NOT affect layout ===== */
#container {
  position: relative;
  overflow: hidden;
}

/* Monaco overlays/widgets (command palette, suggest, hover) should be absolute */
.monaco-editor .overlayWidgets,
.monaco-editor .overlayWidgets > .widget,
.monaco-editor .quick-input-widget,
.monaco-editor .suggest-widget,
.monaco-editor .parameter-hints-widget,
.monaco-editor .monaco-hover,
.monaco-editor .context-view {
  position: absolute !important;
  z-index: 9999 !important;
}

/* Иногда quick-input растягивает блок — фиксируем ширину/центр */
.monaco-editor .quick-input-widget {
  left: 50% !important;
  transform: translateX(-50%) !important;
  top: 8px !important;
}

</style>
</head>
<body>
<div id="root">
    <div class="activitybar">
        <button title="Explorer">📂</button>
    </div>
    <div class="explorer" id="explorer"></div>

    <div class="main">
        <div id="container"></div>
        <div class="statusbar">
            <div class="status-left"><span id="encoding">UTF-8</span></div>
            <div class="status-right"><span id="position">Ln 1, Col 1</span></div>
        </div>
    </div>
</div>

<script src="./vs/loader.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
// Глобально блокируем контекстное меню
document.addEventListener("contextmenu", function (e) {
    // Разрешаем только внутри редактора (#container)
    if (!document.getElementById("container").contains(e.target)) {
        e.preventDefault();
        return false;
    }
}, false);
require.config({ paths: { 'vs': './vs' }});
require(['vs/editor/editor.main'], function () {
    window.editor = monaco.editor.create(document.getElementById('container'), {
        value: "",
        language: "plaintext",
        theme: "vs-dark",
        automaticLayout: true,
        minimap: { enabled: false }
    });

    window.encoding = 'UTF-8';

    function updateStatus(encoding, line, col) {
        var encEl = document.getElementById('encoding');
        var posEl = document.getElementById('position');
        if (encEl) encEl.textContent = encoding || 'UTF-8';
        if (posEl) posEl.textContent = 'Ln ' + line + ', Col ' + col;
    }
    window.updateStatus = updateStatus;

    editor.onDidChangeCursorPosition(function() {
        var p = editor.getPosition();
        updateStatus(window.encoding || 'UTF-8', p.lineNumber, p.column);
    });
    editor.onDidChangeModelContent(function() {
        var p = editor.getPosition();
        updateStatus(window.encoding || 'UTF-8', p.lineNumber, p.column);
    });

    // API для PyQt
    window.getValue = () => window.editor.getValue();
    window.setValueWithLanguage = function(code, lang) {
        const old = window.editor.getModel();
        if(old) old.dispose();
        const model = monaco.editor.createModel(code, lang);
        window.editor.setModel(model);
        window.editor.layout();
    };
});

// WebChannel
// new QWebChannel(qt.webChannelTransport, function(channel) {
//     window.bridge = channel.objects.bridge;

//     document.querySelector('button[title="Explorer"]').addEventListener('click', () => {
//         bridge.open_folder();  // теперь должно работать
//     });
// });


// Показываем файлы в Explorer
window.loadProjectFiles = function(entries, path) {
  const exp = document.getElementById('explorer');
  if (!exp) return;

  exp.innerHTML = "";

  // заголовок: только название текущей папки
  const head = document.createElement("div");
  let p = String(path || "").replace(/\\/g, "/");
  let folderName = p.split("/").filter(Boolean).pop() || "";
  head.textContent = folderName;  // ✅ вместо полного пути
  head.style.padding = "6px";
  head.style.color = "#888";
  head.style.fontSize = "12px";
  exp.appendChild(head);


  if (!Array.isArray(entries)) return;

  entries.forEach(e => {
    const row = document.createElement("div");
    row.className = "explorer-item";

    // ✅ ВОТ ТУТ главная причина [object Object]
    const name = (e && e.name) ? e.name : String(e);
    const type = (e && e.type) ? e.type : "file";

    row.textContent = (type === "folder" ? "📁 " : "📄 ") + name;

    row.addEventListener("click", () => {
      if (!window.bridge) return;

      if (type === "folder") {
        bridge.open_folder_path(path + "/" + name);
      } else {
        bridge.open_file(name); // open_file соберёт fullpath из current_folder
      }
    });

    exp.appendChild(row);
  });
};


function initWebChannel() {
    new QWebChannel(qt.webChannelTransport, function(channel) {
        window.bridge = channel.objects.bridge;

        document.querySelector('button[title="Explorer"]').addEventListener('click', () => {
            bridge.open_folder();
        });
    });
}

// Определяем setEncoding
window.setEncoding = function(enc) {
    window.encoding = enc;
    const encEl = document.getElementById('encoding');
    if(encEl) encEl.textContent = enc;
};

window.addEventListener('DOMContentLoaded', initWebChannel);

window.addEventListener('resize', () => {
  if (window.editor) window.editor.layout();
});

window.setValueWithLanguage = function(code, lang) {
  const old = window.editor.getModel();
  if (old) old.dispose();

  const model = monaco.editor.createModel(code, lang);
  window.editor.setModel(model);

  // важное: layout несколько раз (QWebEngine иногда даёт неправильный размер сразу)
  window.editor.layout();
  setTimeout(() => window.editor && window.editor.layout(), 0);
  setTimeout(() => window.editor && window.editor.layout(), 50);
};

// ✅ Запрещаем выделение текста вне редактора (и вне input/textarea)
document.addEventListener("selectstart", function (e) {
  const container = document.getElementById("container");
  const t = e.target;

  const isInEditor = container && container.contains(t);
  const isInput = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);

  if (!isInEditor && !isInput) {
    e.preventDefault();
    return false;
  }
}, true);

</script>
</body>
</html>
